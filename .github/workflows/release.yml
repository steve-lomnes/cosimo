name: Release
on: # zizmor: ignore[dangerous-triggers] prepare requires workflow_run.event == 'push' below
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, no leading v). Empty = compute it from tags and merged-PR labels (release:major/minor/skip)."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/steve-lomnes/cosimo

jobs:
  # Computes the version and whether to publish (scripts/next-version.sh has the auto-compute
  # logic: highest v* tag, bump from merged-PR release:* labels, skip for a docs-only diff or an
  # already-tagged HEAD). A hand-pushed tag or an explicit `version` input always publishes that
  # exact version, bypassing auto-compute.
  prepare:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      short_sha: ${{ steps.sc.outputs.short }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A hand-pushed tag or an explicit dispatch version always publishes, at that exact
          # version; tags created by this workflow's own GITHUB_TOKEN don't retrigger it, so this
          # path is for a human-made tag or a manual override (a re-run, or the first release).
          if [ "${GITHUB_REF_TYPE:-}" = tag ] || [ -n "${INPUT_VERSION:-}" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = tag ]; then want="${GITHUB_REF_NAME#v}"; else want="${INPUT_VERSION#v}"; fi
            if ! printf '%s' "$want" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::version $want is not semver X.Y.Z[-pre]"
              exit 1
            fi
            case "$want" in *-*) pre=true ;; *) pre=false ;; esac
            {
              echo "version=$want"
              echo "tag=v$want"
              echo "sha=$GITHUB_SHA"
              echo "publish=true"
              echo "prerelease=$pre"
            } | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Short commit
        id: sc
        env:
          SHA: ${{ steps.v.outputs.sha }}
        run: echo "short=$(git rev-parse --short=7 "$SHA")" >> "$GITHUB_OUTPUT"

  binaries:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: $/.github/actions/setup-bun
        with:
          no-cache: true
      # --os/--cpu '*' installs every platform's optional deps, so each target's
      # @libsql/<platform> native addon is present for cross-compilation.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run build:web
      - name: Cross-compile all targets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""
            [ "$t" = windows-x64 ] && ext=".exe"
            bun apps/server/scripts/build-binary.ts --target "bun-$t" --outfile "dist/cosimo-$t$ext" \
              --version "$VERSION" --commit "$COMMIT"
          done
          ls -l dist
      - name: Smoke test linux-x64
        env:
          WANT: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out=$(./dist/cosimo-linux-x64 version)
          echo "$out"
          [ "$out" = "cosimo $WANT" ] || { echo "::error::binary reports '$out', expected 'cosimo $WANT'"; exit 1; }
          ./dist/cosimo-linux-x64 init --questions --json > /dev/null
      - name: Checksums
        working-directory: dist
        run: sha256sum cosimo-* > checksums.txt && cat checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # One Sigstore bundle (signature, certificate and transparency-log entry); install.sh verifies
      # it with `cosign verify-blob --bundle`.
      - name: Sign checksums.txt (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      # GitHub stores attestations only for public repos on a personal account; cosign still signs
      # checksums.txt above while the repo is private.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/cosimo-*
            dist/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, binaries]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "Cosimo $TAG" --generate-notes)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The tag already exists (that's what triggered this run); verify it instead of
            # creating one, so `gh` doesn't try to tag $GITHUB_SHA a second time.
            flags+=(--verify-tag)
          else
            # The tag is created here, after a successful binaries build, so a failed build leaves
            # no tag behind and the next run retries the same version.
            flags+=(--target "$SHA")
          fi
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" \
            dist/cosimo-linux-x64 \
            dist/cosimo-linux-arm64 \
            dist/cosimo-darwin-x64 \
            dist/cosimo-darwin-arm64 \
            dist/cosimo-windows-x64.exe \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json \
            scripts/install.sh \
            scripts/install.ps1

  # After binaries, so a failed build doesn't leave a published image with no release behind it.
  image:
    needs: [prepare, binaries]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      # The Dockerfile's builder stage runs on the build platform and cross-compiles with
      # bun --target, so no QEMU is needed for linux/arm64.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COSIMO_VERSION=${{ needs.prepare.outputs.version }}
            COSIMO_COMMIT=${{ needs.prepare.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # A deploy pipeline can verify this signature before shipping the image.
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
