name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, sqld]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Start libSQL server (sqld with namespaces)
        if: matrix.db == 'sqld'
        run: |
          # Pinned by hand to the multi-arch index digest; Dependabot doesn't track image refs
          # inside run: steps.
          docker run -d --name sqld -p 8080:8080 -p 8081:8081 \
            ghcr.io/tursodatabase/libsql-server:v0.24.32@sha256:dedf5273da945d90f3b85fe367ed8f821349117ac2c488bf43c4a6bf9f2123e0 \
            /bin/sqld --enable-namespaces --admin-listen-addr 0.0.0.0:8081
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - name: bun run test
        run: bun run test
        env:
          COSIMO_TEST_DB: ${{ matrix.db }}
          COSIMO_TEST_SQLD_URL: ${{ matrix.db == 'sqld' && 'http://localhost:8080' || '' }}
          COSIMO_TEST_SQLD_ADMIN: ${{ matrix.db == 'sqld' && 'http://127.0.0.1:8081' || '' }}

  chain-hash:
    name: canonical hash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun test packages/core/src/chain.vectors.test.ts packages/core/src/canonical.test.ts
      - name: Parse install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bun run --cwd apps/server build:binary
      - name: Smoke test the binary
        run: |
          ./dist/cosimo version
          ./dist/cosimo init --questions --json > /dev/null
          echo '{"admin_email":"ci@example.com","org_name":"CI","data_dir":"'$RUNNER_TEMP'/cosimo","service":false,"port":18787}' \
            | ./dist/cosimo init --answers - --yes --json
          ./dist/cosimo serve --config $RUNNER_TEMP/cosimo/config.toml &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18787/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:18787/ | grep -q '<div id="root">'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t cosimo:ci .
      - name: Smoke test
        run: |
          docker run --rm cosimo:ci version
          docker run -d --name cosimo-smoke -p 18788:8787 -e COSIMO_MASTER_KEY="$(openssl rand -base64 32)" cosimo:ci
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18788/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:18788/healthz
          docker exec cosimo-smoke cosimo doctor --json > doctor.json || true
          grep -q '"id": "system_db"' doctor.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=bun.lock

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          advanced-security: true
